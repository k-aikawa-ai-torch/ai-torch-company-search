<script>

const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZxdW5pYmh6bXZsY2txYnlkZ2VhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyMzY0NTYsImV4cCI6MjA5NzgxMjQ1Nn0.t9_RIVPY1vrgGmxxFFYXP9uWxT7401ha4Flc9q0_zMA';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const MEMBER_MAP = {'相川':'aikawa_kenta','永井':'nagai_yudai','會澤':'aizawa_yuma'};
const MEMBER_NAMES = {'aikawa_kenta':'相川','nagai_yudai':'永井','aizawa_yuma':'會澤'};
const ACCEPT_PHASES = ['内定承諾','入社待ち','入社済み'];
const PIPELINE_PHASE_LIST = ['未提案','提案中','応募承諾','書類選考','カジュアル面談','一次面接','二次～面接','最終面接','内定','内定承諾','入社待ち','入社済み'];

let MEMBERS = [], PIPELINE_DATA = [], CANDIDATE_DATA = [], PHASE_HISTORY = [], OTHER_REVENUE = [];
let currentMember = '全員';
let plSelectedMonth = new Date().toISOString().substring(0,7);
let checklistSortKey = 'accept_date';
let checklistSortDir = -1;
let checklistFilter = 'all';
let checklistMemberFilter = '';
let otherRevSortKey = 'date';
let otherRevSortDir = -1;
let CURRENT_USER_EMAIL = null;
let ME = null;

async function doLogin() {
  const email = document.getElementById('email-input').value;
  const password = document.getElementById('pw-input').value;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { document.getElementById('lock-error').textContent = 'メールアドレスまたはパスワードが違います'; return; }
  CURRENT_USER_EMAIL = email;
  showApp();
}
async function doLogout() { await sb.auth.signOut(); location.reload(); }
function showApp() {
  document.getElementById('lock-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadData();
}
sb.auth.getSession().then(({ data: { session } }) => { if (session) { CURRENT_USER_EMAIL = session.user.email; showApp(); } });

async function fetchAllRange(table, select) {
  let all = [], from = 0;
  const size = 1000;
  while (true) {
    const { data, error } = await sb.from(table).select(select).range(from, from + size - 1);
    if (error || !data || data.length === 0) break;
    all = all.concat(data);
    if (data.length < size) break;
    from += size;
  }
  return all;
}

async function loadData() {
  const [{ data: members }, { data: candidates }, pipeline, phaseHistory, { data: otherRevenue }] = await Promise.all([
    sb.from('members').select('*'),
    sb.from('candidates').select('*,members(name,display_name)').is('deleted_at', null),
    fetchAllRange('pipeline', '*, members(name,display_name), candidates(name,source,revenue_forecast,gross_profit), companies(name)'),
    fetchAllRange('pipeline_phase_history', '*'),
    sb.from('other_revenue').select('*,members(name,display_name)').order('revenue_date', { ascending: false }),
  ]);

  MEMBERS = members || [];
  CANDIDATE_DATA = candidates || [];
  PIPELINE_DATA = pipeline || [];
  PHASE_HISTORY = phaseHistory || [];
  OTHER_REVENUE = otherRevenue || [];

  document.getElementById('header-badge').textContent = today().substring(0,7);
  ME = MEMBERS.find(m => m.email === CURRENT_USER_EMAIL);
  if (ME) {
    const myLabel = Object.keys(MEMBER_MAP).find(k => MEMBER_MAP[k] === ME.name);
    if (myLabel) {
      currentMember = myLabel;
      document.querySelectorAll('.member-tab').forEach(t => t.classList.toggle('active', t.textContent === myLabel));
    }
  }
  render();
}

function setMember(m, el) {
  currentMember = m;
  document.querySelectorAll('.member-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  render();
}

function filterByMemberName(arr, memberName) {
  if (memberName === '全員') return arr;
  const key = MEMBER_MAP[memberName];
  return arr.filter(x => x.members && x.members.name === key);
}

function toLocalDateStr(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function today() { return toLocalDateStr(new Date()); }
function cleanSource(s) { return (s || '').replace(/^[（(]+/, '').trim(); }

// 8月始まり・4ヶ月区切りの期を計算する（ダッシュボードと同じ定義）
function getAllMonthsSince202502() {
  const months = [];
  const start = new Date(2025, 1, 1); // 2025-02
  const now = new Date();
  const end = new Date(now.getFullYear(), now.getMonth() + 6, 1); // 半年後まで表示可能にする
  for (let d = new Date(start); d <= end; d.setMonth(d.getMonth() + 1)) {
    months.push(d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'));
  }
  return months.reverse();
}
function setPlMonth(m) { plSelectedMonth = m; render(); }

function getTermInfo(ym) {
  const [y, mo] = ym.split('-').map(Number);
  const fyStartYear = mo >= 8 ? y : y - 1;
  const monthIndexInFY = (mo - 8 + 12) % 12;
  const termIndex = Math.floor(monthIndexInFY / 4);
  const termNames = ['第1期','第2期','第3期'];
  const termStartOffset = termIndex * 4;
  const months = [];
  for (let i = 0; i < 4; i++) {
    const d = new Date(fyStartYear, 7 + termStartOffset + i, 1);
    months.push(d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'));
  }
  const yearMonths = [];
  for (let i = 0; i < 12; i++) {
    const d = new Date(fyStartYear, 7 + i, 1);
    yearMonths.push(d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'));
  }
  return { termLabel: termNames[termIndex], termRangeLabel: months[0] + '〜' + months[3], months, yearLabel: fyStartYear + '/8〜' + (fyStartYear+1) + '/7', yearMonths };
}
function fmtSalary(v) { if (v==null) return '¥0'; return '¥' + Math.round(v).toLocaleString(); }

function firstOccurrenceMap(pipelineItems, phases) {
  const ids = new Set(pipelineItems.map(p => p.id));
  const map = {};
  PHASE_HISTORY.filter(h => ids.has(h.pipeline_id) && phases.includes(h.phase)).forEach(h => {
    if (!map[h.pipeline_id] || h.changed_at < map[h.pipeline_id]) map[h.pipeline_id] = h.changed_at;
  });
  return map;
}

// ===== 決定ベース（内定承諾日基準）と発生ベース（入社日基準）の売上・粗利集計 =====
function sumDecisionBasis(pipelineItems, monthList) {
  const map = firstOccurrenceMap(pipelineItems, ACCEPT_PHASES);
  const counted = new Set();
  let revenue = 0, profit = 0;
  Object.keys(map).forEach(pid => {
    if (!monthList.includes(map[pid].substring(0,7))) return;
    const p = pipelineItems.find(x => x.id === pid);
    if (!p || !p.candidate_id || counted.has(p.candidate_id)) return;
    counted.add(p.candidate_id);
    if (p.candidates?.revenue_forecast) revenue += p.candidates.revenue_forecast;
    if (p.candidates?.gross_profit != null) profit += p.candidates.gross_profit;
  });
  // 入社前辞退などによる返金：出金月がこの期間に含まれる場合、売上・粗利をマイナス計上する
  pipelineItems.forEach(p => {
    if (!p.refund_date || !monthList.includes(p.refund_date.substring(0,7))) return;
    if (p.candidates?.revenue_forecast) revenue -= p.candidates.revenue_forecast;
    if (p.candidates?.gross_profit != null) profit -= p.candidates.gross_profit;
  });
  return { revenue, profit };
}

function sumAccrualBasis(pipelineItems, monthList) {
  const counted = new Set();
  let revenue = 0, profit = 0;
  pipelineItems.forEach(p => {
    if (!p.hire_date || !monthList.includes(p.hire_date.substring(0,7))) return;
    if (!p.candidate_id || counted.has(p.candidate_id)) return;
    counted.add(p.candidate_id);
    if (p.candidates?.revenue_forecast) revenue += p.candidates.revenue_forecast;
    if (p.candidates?.gross_profit != null) profit += p.candidates.gross_profit;
  });
  // 入社前辞退などによる返金：出金月がこの期間に含まれる場合、売上・粗利をマイナス計上する
  pipelineItems.forEach(p => {
    if (!p.refund_date || !monthList.includes(p.refund_date.substring(0,7))) return;
    if (p.candidates?.revenue_forecast) revenue -= p.candidates.revenue_forecast;
    if (p.candidates?.gross_profit != null) profit -= p.candidates.gross_profit;
  });
  return { revenue, profit };
}

function sumOtherRevenueForMonths(memberIds, monthList) {
  let revenue = 0;
  OTHER_REVENUE.filter(r => monthList.includes(r.revenue_date.substring(0,7)) && (currentMember === '全員' || memberIds.includes(r.member_id)))
    .forEach(r => { revenue += (r.amount||0); });
  // 原価0（人材紹介以外の売上は粗利＝売上そのものとして扱う）
  return { revenue, profit: revenue };
}

function setOtherRevSort(key) {
  if (otherRevSortKey === key) { otherRevSortDir *= -1; } else { otherRevSortKey = key; otherRevSortDir = 1; }
  render();
}
function setChecklistFilter(v) { checklistFilter = v; render(); }
function setChecklistMemberFilter(v) { checklistMemberFilter = v; render(); }
function setChecklistSort(key) {
  if (checklistSortKey === key) { checklistSortDir *= -1; } else { checklistSortKey = key; checklistSortDir = 1; }
  render();
}

function computePLForMonth(pipelineScope, memberIdsScope, m) {
  const dec = sumDecisionBasis(pipelineScope, [m]);
  const acc = sumAccrualBasis(pipelineScope, [m]);
  const other = sumOtherRevenueForMonths(memberIdsScope, [m]);
  return {
    decRevenue: dec.revenue + other.revenue, decProfit: dec.profit + other.profit,
    accRevenue: acc.revenue + other.revenue, accProfit: acc.profit + other.profit,
  };
}

let monthlyHistoryRange = { from: -3, to: 3 };

function monthOffset(baseYm, offset) {
  const [y, m] = baseYm.split('-').map(Number);
  const d = new Date(y, m - 1 + offset, 1);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}

function renderMonthlyHistoryTable(skipAutoScroll) {
  const todayMonth = today().substring(0,7);
  const validMonths = getAllMonthsSince202502(); // 2025-02〜半年後まで、新しい月から順
  const monthsAsc = [];
  for (let i = monthlyHistoryRange.from; i <= monthlyHistoryRange.to; i++) {
    const m = monthOffset(todayMonth, i);
    if (validMonths.includes(m)) monthsAsc.push(m);
  }
  const months = monthsAsc.slice().reverse(); // 新しい月から順に表示

  function plCells(d) {
    return '<td>' + fmtSalary(d.decRevenue) + '</td><td>' + fmtSalary(d.decProfit) + '</td>' +
      '<td>' + fmtSalary(d.accRevenue) + '</td><td>' + fmtSalary(d.accProfit) + '</td>';
  }

  let html = '<table class="rev-table"><thead><tr><th>月／担当</th><th>決定ベース売上</th><th>決定ベース粗利</th><th>発生ベース売上</th><th>発生ベース粗利</th></tr></thead><tbody>';

  if (currentMember === '全員') {
    months.forEach(function(m) {
      const total = computePLForMonth(PIPELINE_DATA, MEMBERS.map(x=>x.id), m);
      html += '<tr id="mh-' + m + '" style="font-weight:600;background:#f9f9f7"><td>' + m + '　（' + MEMBERS.length + '人合計）</td>' + plCells(total) + '</tr>';
      MEMBERS.forEach(function(mem) {
        const mp = PIPELINE_DATA.filter(p => p.members && p.members.name === mem.name);
        const d = computePLForMonth(mp, [mem.id], m);
        html += '<tr><td style="padding-left:24px;color:#6B7A99">' + (mem.display_name || MEMBER_NAMES[mem.name] || mem.name) + '</td>' + plCells(d) + '</tr>';
      });
    });
  } else {
    const memberIds = [MEMBERS.find(m => m.name === MEMBER_MAP[currentMember])?.id];
    const myScopedPipeline = filterByMemberName(PIPELINE_DATA, currentMember);
    months.forEach(function(m) {
      const d = computePLForMonth(myScopedPipeline, memberIds, m);
      html += '<tr id="mh-' + m + '"><td>' + m + '</td>' + plCells(d) + '</tr>';
    });
  }
  html += '</tbody></table>';

  const el = document.getElementById('monthly-history-wrap');
  if (el) {
    el.innerHTML = html;
    initMonthlyHistoryScroll();
    if (!skipAutoScroll) {
      requestAnimationFrame(() => {
        const anchor = document.getElementById('mh-' + todayMonth);
        if (anchor) anchor.scrollIntoView({ block: 'start' });
      });
    }
  }
  return '<div class="checklist-scroll-wrap" id="monthly-history-wrap" style="max-height:500px">' + html + '</div>';
}

function initMonthlyHistoryScroll() {
  const wrap = document.getElementById('monthly-history-wrap');
  if (!wrap || wrap._scrollBound) return;
  wrap._scrollBound = true;
  wrap.addEventListener('scroll', function() {
    if (wrap._expanding) return;
    if (wrap.scrollTop < 60) {
      wrap._expanding = true;
      const prevHeight = wrap.scrollHeight;
      const prevScrollTop = wrap.scrollTop;
      monthlyHistoryRange.to += 3;
      renderMonthlyHistoryTable(true);
      requestAnimationFrame(() => {
        wrap.scrollTop = prevScrollTop + (wrap.scrollHeight - prevHeight);
        wrap._expanding = false;
      });
    } else if (wrap.scrollTop + wrap.clientHeight > wrap.scrollHeight - 60) {
      wrap._expanding = true;
      monthlyHistoryRange.from -= 3;
      renderMonthlyHistoryTable(true);
      wrap._expanding = false;
    }
  });
}

// 入力の保存など、画面位置を保ったまま再描画したい場合に使う
function renderKeepScroll() {
  const y = window.scrollY;
  const scrollWraps = ['checklist-scroll-wrap', 'monthly-history-wrap'];
  const savedLeft = {};
  scrollWraps.forEach(id => {
    const el = document.getElementById(id);
    if (el) savedLeft[id] = el.scrollLeft;
  });
  render();
  const restore = () => {
    window.scrollTo(0, y);
    scrollWraps.forEach(id => {
      const el = document.getElementById(id);
      if (el && savedLeft[id] != null) el.scrollLeft = savedLeft[id];
    });
  };
  requestAnimationFrame(() => {
    restore();
    requestAnimationFrame(restore);
  });
  setTimeout(restore, 50);
}

function render() {
  const el = document.getElementById('content');
  const myPipeline = filterByMemberName(PIPELINE_DATA, currentMember);
  const memberIds = currentMember === '全員' ? MEMBERS.map(m=>m.id) : [MEMBERS.find(m=>m.name===MEMBER_MAP[currentMember])?.id];

  let html = '';

  // ===== P/L：決定ベース／発生ベース × 月・期・年 =====
  const term = getTermInfo(plSelectedMonth);
  const curMonth = [plSelectedMonth];

  function combined(fn, monthList) {
    const rec = fn(myPipeline, monthList);
    const oth = sumOtherRevenueForMonths(memberIds, monthList);
    return { revenue: rec.revenue + oth.revenue, profit: rec.profit + oth.profit };
  }

  function plRow(label, data) {
    return '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:13px">' +
      '<span style="color:#6B7A99">' + label + '</span>' +
      '<span>売上 <strong>' + fmtSalary(data.revenue) + '</strong>　粗利 <strong style="color:#1baf7a">' + fmtSalary(data.profit) + '</strong></span></div>';
  }

    c += '<div class="hero-label" style="color:' + color + ';font-weight:600">' + title + '</div>';
    c += plRow('月（' + curMonth[0] + '）', combined(fn, curMonth));
    c += plRow(term.termLabel + '（' + term.termRangeLabel + '）', combined(fn, term.months));
    c += plRow('年間（' + term.yearLabel + '）', combined(fn, term.yearMonths));
    c += '</div>';

  html += '<div class="section-block">';
  html += '<div class="sec-header"><span class="bar" style="background:#0D40D9"></span><span class="title">売上・粗利（P/L）</span><span class="sub">人材紹介＋その他売上の合算</span></div>';
  html += '<div class="form-row" style="margin-bottom:12px"><div class="form-group"><label>表示する月を選択（期・年もこの月を含む期間になります）</label><select id="pl-month-select" onchange="setPlMonth(this.value)">' +
    getAllMonthsSince202502().map(m => '<option value="' + m + '"' + (m===plSelectedMonth?' selected':'') + '>' + m + '</option>').join('') + '</select></div></div>';
  html += '<div style="display:flex;gap:16px;flex-wrap:wrap">';
  html += plCard('決定ベース（内定承諾日基準）', '#0D40D9', sumDecisionBasis);
  html += plCard('発生ベース（入社日基準）', '#eb6834', sumAccrualBasis);
  html += '</div>';
  html += '</div>';

  // ===== その他売上入力 =====
  html += '<div class="section-block">';
  html += '<div class="sec-header"><span class="bar" style="background:#9aa3b8"></span><span class="title">人材紹介以外の売上</span><span class="sub">都度手入力・コンサル費用/顧問料など</span></div>';
  html += '<div class="form-row">';
  html += '<div class="form-group"><label>日付</label><input type="date" id="or-date" value="' + today() + '"></div>';
  html += '<div class="form-group"><label>金額（円）</label><input type="number" id="or-amount" placeholder="例: 300000"></div>';
  html += '<div class="form-group"><label>事業カテゴリ</label><select id="or-category"><option>採用コンサル・リテーナー・RPOなど</option><option>BW</option><option>顧問</option><option>その他</option></select></div>';
  html += '<div class="form-group" style="flex:1;min-width:160px"><label>内容</label><input type="text" id="or-desc" placeholder="例: 〇〇社 顧問料 7月分"></div>';
  html += '<button class="btn-save" onclick="addOtherRevenue()">＋ 追加</button>';
  html += '</div>';
  html += renderOtherRevenueTable(memberIds);

  html += '<div class="tag-filters">' +
    [['all','すべて表示'],['contract_pending','成約報告がまだ'],['hire_pending','入社がまだ'],['post_hire_pending','入社後フォロー等がまだ'],['payment_pending','入金確認がまだ'],['completed','すべて終わったもの']]
      .map(([k,l]) => '<span class="tag' + (checklistFilter===k?' on':'') + '" onclick="setChecklistFilter(\''+k+'\')">'+l+'</span>').join('') +

  el.innerHTML = html;

function renderOtherRevenueTable(memberIds) {
  let rows = OTHER_REVENUE.filter(r => currentMember === '全員' || memberIds.includes(r.member_id));
  if (!rows.length) return '<div style="color:#9aa3b8;font-size:12px">まだ登録がありません</div>';

  const CATEGORY_OPTS = ['採用コンサル・リテーナー・RPOなど','BW','顧問','その他'];

  function cmp(a, b) {
    if (otherRevSortKey === 'date') return (a.revenue_date||'').localeCompare(b.revenue_date||'');
    if (otherRevSortKey === 'member') return ((a.members?.display_name)||'').localeCompare((b.members?.display_name)||'','ja');
    if (otherRevSortKey === 'category') return (a.category||'').localeCompare(b.category||'','ja');
    if (otherRevSortKey === 'amount') return (a.amount||0) - (b.amount||0);
    if (otherRevSortKey === 'desc') return (a.description||'').localeCompare(b.description||'','ja');
    return 0;
  }
  rows = rows.slice().sort((a,b) => otherRevSortDir * cmp(a,b));

  function th(key, label) {
    const active = otherRevSortKey === key;
    return '<th class="sort-th" onclick="setOtherRevSort(\'' + key + '\')">' + label +
      '<span class="sort-arrow' + (active ? ' active' : '') + '">' + (active ? (otherRevSortDir===1?'▲':'▼') : '↕') + '</span></th>';
  }
  let html = '<table class="rev-table"><thead><tr>' +
    th('date','日付') + th('member','担当') + th('category','事業カテゴリ') + th('amount','金額') + th('desc','内容') + '<th></th>' +
    '</tr></thead><tbody>';
  rows.forEach(r => {
    const memberOpts = MEMBERS.map(m => '<option value="'+m.id+'"'+(m.id===r.member_id?' selected':'')+'>'+(m.display_name||MEMBER_NAMES[m.name])+'</option>').join('');
    const categoryOpts = CATEGORY_OPTS.map(c => '<option'+(c===r.category?' selected':'')+'>'+c+'</option>').join('');
    html += '<tr>' +
      '<td><input type="date" class="hire-date-input" value="' + r.revenue_date + '" onchange="saveOtherRevenueField(\'' + r.id + '\',\'revenue_date\',this.value)"></td>' +
      '<td><select onchange="saveOtherRevenueField(\'' + r.id + '\',\'member_id\',this.value)">' + memberOpts + '</select></td>' +
      '<td><select onchange="saveOtherRevenueField(\'' + r.id + '\',\'category\',this.value)">' + categoryOpts + '</select></td>' +
      '<td><input type="number" class="hire-date-input" style="width:100px" value="' + r.amount + '" onchange="saveOtherRevenueField(\'' + r.id + '\',\'amount\',parseFloat(this.value)||0)"></td>' +
      '<td><input type="text" class="hire-date-input" style="width:180px" value="' + (r.description||'').replace(/"/g,'&quot;') + '" onchange="saveOtherRevenueField(\'' + r.id + '\',\'description\',this.value||null)"></td>' +
      '<td><button class="del-btn" onclick="deleteOtherRevenue(\'' + r.id + '\')">削除</button></td></tr>';
  });
  html += '</tbody></table>';
  return html;
}

async function saveOtherRevenueField(id, field, value) {
  const { error } = await sb.from('other_revenue').update({ [field]: value }).eq('id', id);
  if (error) { alert('保存に失敗しました: ' + error.message); return; }
  const r = OTHER_REVENUE.find(x => x.id === id);
  if (r) {
    r[field] = value;
    if (field === 'member_id') { r.members = MEMBERS.find(m => m.id === value) || null; }
  }
  renderKeepScroll();
}

async function addOtherRevenue() {
  const date = document.getElementById('or-date').value;
  const amount = parseFloat(document.getElementById('or-amount').value);
  const desc = document.getElementById('or-desc').value;
  const category = document.getElementById('or-category').value;
  if (!date || !amount) { alert('日付と金額を入力してください'); return; }
  const memberId = ME ? ME.id : (currentMember !== '全員' ? MEMBERS.find(m=>m.name===MEMBER_MAP[currentMember])?.id : null);
  const { error } = await sb.from('other_revenue').insert({ member_id: memberId, revenue_date: date, amount: amount, description: desc || null, category: category });
  if (error) { alert('保存に失敗しました: ' + error.message); return; }
  const { data } = await sb.from('other_revenue').select('*,members(name,display_name)').order('revenue_date', { ascending: false });
  OTHER_REVENUE = data || [];
  render();
}

async function deleteOtherRevenue(id) {
  if (!confirm('削除してよいですか？')) return;
  const { error } = await sb.from('other_revenue').delete().eq('id', id);
  if (error) { alert('削除に失敗しました: ' + error.message); return; }
  OTHER_REVENUE = OTHER_REVENUE.filter(r => r.id !== id);
  renderKeepScroll();
}

// ============ 事務処理チェックリスト ============
const CHECKLIST_ITEMS = [
  { key: 'checklist_contract_report', label: '成約報告', due: 'accept' },
  { key: 'checklist_candidate_followup', label: '人材フォロー', due: 'hire' },
  { key: 'checklist_invoice', label: '請求書発行', due: 'hire' },
  { key: 'checklist_company_confirm', label: '企業入社確認', due: 'hire' },
  { key: 'checklist_media_report', label: '媒体入社報告', due: 'hire' },
  { key: 'checklist_payment_confirm', label: '入金確認', due: 'payment' },
];

function lastDayOfNextMonth(hireDate) {
  const d = new Date(hireDate);
  const nextMonthLastDay = new Date(d.getFullYear(), d.getMonth() + 2, 0);
  return toLocalDateStr(nextMonthLastDay);
}

function renderChecklist(pipelineItems) {
  const acceptMap = firstOccurrenceMap(pipelineItems, ACCEPT_PHASES);
  let targets = pipelineItems.filter(p => acceptMap[p.id]);
  if (!targets.length) return '<div style="color:#9aa3b8;font-size:12px">対象の案件がまだありません</div>';

  const todayStr = today();
  const POST_HIRE_KEYS = ['checklist_candidate_followup','checklist_invoice','checklist_company_confirm','checklist_media_report'];

  // ===== 絞り込み =====
  if (checklistMemberFilter) targets = targets.filter(p => p.member_id === checklistMemberFilter);
  if (checklistFilter === 'contract_pending') targets = targets.filter(p => !p.checklist_contract_report);
  else if (checklistFilter === 'hire_pending') targets = targets.filter(p => !p.hire_date || p.hire_date > todayStr);
  else if (checklistFilter === 'post_hire_pending') targets = targets.filter(p => p.hire_date && p.hire_date <= todayStr && POST_HIRE_KEYS.some(k => !p[k]));
  else if (checklistFilter === 'payment_pending') targets = targets.filter(p => !p.checklist_payment_confirm);
  else if (checklistFilter === 'completed') targets = targets.filter(p => p.hire_date && CHECKLIST_ITEMS.every(it => p[it.key]));

  if (!targets.length) return '<div style="color:#9aa3b8;font-size:12px">該当する案件がありません</div>';

  // ===== ソート =====
  function val(p, key) {
    const acceptDate = acceptMap[p.id] ? acceptMap[p.id].substring(0,10) : '';
    const revenueForecast = p.candidates?.revenue_forecast || 0;
    const grossProfit = p.candidates?.gross_profit != null ? p.candidates.gross_profit : null;
    const cost = grossProfit != null ? revenueForecast - grossProfit : null;
    switch(key) {
      case 'candidate': return p.candidates?.name || '';
      case 'company': return p.companies?.name || '';
      case 'member': return p.members?.display_name || '';
      case 'source': return cleanSource(p.candidates?.source);
      case 'accept_date': return acceptDate;
      case 'hire_date': return p.hire_date || '';
      case 'theoretical_salary': return p.theoretical_salary != null ? p.theoretical_salary : revenueForecast;
      case 'cost': return cost != null ? cost : -Infinity;
      case 'profit': return grossProfit != null ? grossProfit : -Infinity;
      case 'revenue': return revenueForecast;
      case 'payment_date': return p.payment_date || '';
      case 'refund_date': return p.refund_date || '';
      default: return '';
    }
  }
  targets = targets.slice().sort((a,b) => {
    const va = val(a, checklistSortKey), vb = val(b, checklistSortKey);
    if (typeof va === 'string') return checklistSortDir * va.localeCompare(vb, 'ja');
    return checklistSortDir * (va - vb);
  });

  function th(key, label) {
    const active = checklistSortKey === key;
    return '<th class="sort-th" onclick="setChecklistSort(\'' + key + '\')">' + label +
      '<span class="sort-arrow' + (active ? ' active' : '') + '">' + (active ? (checklistSortDir===1?'▲':'▼') : '↕') + '</span></th>';
  }
  let html = '<div class="checklist-scroll-wrap" id="checklist-scroll-wrap"><table class="checklist-table">' +
    '<colgroup><col style="width:90px"><col style="width:140px"><col style="width:60px"><col style="width:140px">' +
    '<col style="width:100px"><col style="width:100px"><col style="width:90px"><col style="width:90px"><col style="width:90px"><col style="width:90px">' +
    '<col style="width:100px"><col style="width:100px">' +
    CHECKLIST_ITEMS.map(()=>'<col style="width:95px">').join('') +
    '<col style="width:150px"><col style="width:60px"></colgroup>' +
    '<thead><tr>' +
    th('candidate','候補者') + th('company','企業') + th('member','担当') + th('source','流入経路') + th('accept_date','内定承諾日') + th('hire_date','入社日') +
    th('theoretical_salary','理論年収') + th('cost','原価') + th('profit','粗利') + th('revenue','売上金額') + th('payment_date','入金日') + th('refund_date','出金日');
  CHECKLIST_ITEMS.forEach(it => { html += '<th>' + it.label + '</th>'; });
  html += '<th>備考</th><th></th></tr></thead><tbody>';

  targets.forEach(p => {
    const acceptDate = acceptMap[p.id] ? acceptMap[p.id].substring(0,10) : null;
    const revenueForecast = p.candidates?.revenue_forecast || 0;
    const grossProfit = p.candidates?.gross_profit != null ? p.candidates.gross_profit : null;
    const cost = grossProfit != null ? revenueForecast - grossProfit : null;
    const theoreticalSalary = p.theoretical_salary != null ? p.theoretical_salary : revenueForecast;

    html += '<tr>';
    html += '<td><strong>' + (p.candidates?.name||'-') + '</strong></td>';
    html += '<td style="color:#6B7A99">' + (p.companies?.name||'-') + '</td>';
    html += '<td style="color:#6B7A99">' + (p.members?.display_name||'-') + '</td>';
    html += '<td style="color:#6B7A99">' + (cleanSource(p.candidates?.source)||'-') + '</td>';
    html += '<td><input type="date" class="hire-date-input" value="' + (acceptDate||'') + '" onchange="saveAcceptDate(\'' + p.id + '\',this.value)"></td>';
    html += '<td><input type="date" class="hire-date-input" value="' + (p.hire_date||'') + '" onchange="saveHireDate(\'' + p.id + '\',this.value)"></td>';
    html += '<td><input type="number" class="hire-date-input" style="width:90px" value="' + theoreticalSalary + '" onchange="saveField(\'' + p.id + '\',\'theoretical_salary\',this.value?parseFloat(this.value):null)"></td>';
    html += '<td style="color:#6B7A99">' + (cost != null ? fmtSalary(cost) : '-') + '</td>';
    html += '<td style="color:#1baf7a;font-weight:500">' + (grossProfit != null ? fmtSalary(grossProfit) : '-') + '</td>';
    html += '<td style="color:#6B7A99">' + fmtSalary(revenueForecast) + '</td>';
    html += '<td><input type="date" class="hire-date-input" value="' + (p.payment_date||'') + '" onchange="saveField(\'' + p.id + '\',\'payment_date\',this.value||null)"></td>';
    html += '<td><input type="date" class="hire-date-input" value="' + (p.refund_date||'') + '" onchange="saveField(\'' + p.id + '\',\'refund_date\',this.value||null)"></td>';

    CHECKLIST_ITEMS.forEach(it => {
      let dueDate = null;
      if (it.due === 'accept') dueDate = acceptDate;
      else if (it.due === 'hire') dueDate = p.hire_date;
      else if (it.due === 'payment') dueDate = p.payment_date || (p.hire_date ? lastDayOfNextMonth(p.hire_date) : null);
      const isDone = !!p[it.key];
      const isOverdue = !isDone && dueDate && dueDate < todayStr;
      html += '<td class="chk-cell' + (isOverdue ? ' overdue' : '') + '">' +
        (dueDate ? '<span class="chk-label">' + dueDate + '</span>' : '') +
        '<input type="checkbox" ' + (isDone ? 'checked' : '') + ' onchange="toggleChecklistItem(\'' + p.id + '\',\'' + it.key + '\',this.checked)">' +
        '</td>';
    });
    html += '<td><input type="text" class="hire-date-input" style="width:140px" value="' + (p.checklist_note||'').replace(/"/g,'&quot;') + '" placeholder="備考" onchange="saveField(\'' + p.id + '\',\'checklist_note\',this.value||null)"></td>';
    html += '<td><button class="icon-btn" style="color:#b3261e" title="決定を取り消す" onclick="deleteDecision(\'' + p.id + '\')">🗑️</button></td>';
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  return html;
}

async function saveField(pipelineId, key, value) {
  const { error } = await sb.from('pipeline').update({ [key]: value }).eq('id', pipelineId);
  if (error) { alert('保存に失敗しました: ' + error.message); return; }
  const p = PIPELINE_DATA.find(x => x.id === pipelineId);
  if (p) p[key] = value;
  renderKeepScroll();
}

function pipelinePhaseToCandidatePhase(pipelinePhase) {
  const map = {
    '内定': '内定KITAAA',
    '最終面接': '選考なう', '二次～面接': '選考なう', '一次面接': '選考なう', 'カジュアル面談': '選考なう', '書類選考': '選考なう',
    '応募承諾': '求人提案なう', '提案中': '求人提案なう', '未提案': '求人提案なう',
  };
  return map[pipelinePhase] || '選考なう';
}

async function deleteDecision(pipelineId) {
  const p = PIPELINE_DATA.find(x => x.id === pipelineId);
  if (!p) return;
  // 内定承諾の直前のフェーズ履歴を探し、そこまでフェーズを戻す
  const allHistory = PHASE_HISTORY.filter(h => h.pipeline_id === pipelineId).slice().sort((a,b) => a.changed_at.localeCompare(b.changed_at));
  const acceptRecords = allHistory.filter(h => h.phase === '内定承諾');
  if (!acceptRecords.length) { alert('内定承諾の履歴が見つかりませんでした'); return; }
  const acceptRecord = acceptRecords[0];
  const priorRecords = allHistory.filter(h => h.changed_at < acceptRecord.changed_at);
  let priorPhase = priorRecords.length ? priorRecords[priorRecords.length - 1].phase : null;

  if (!priorPhase) {
    const input = prompt('内定承諾より前のフェーズ履歴が見つかりませんでした。戻すフェーズを入力してください（' + PIPELINE_PHASE_LIST.join(' / ') + '）', '最終面接');
    if (input === null) return;
    if (PIPELINE_PHASE_LIST.includes(input)) priorPhase = input;
    else { alert('入力されたフェーズが一覧にありません。処理を中止しました。'); return; }
  }

  if (!confirm((p.candidates?.name||'候補者') + ' の内定承諾を取り消します。決定日・粗利・決定ヨミなどの記録が削除され、フェーズ/ステータスも登録前' + (priorPhase ? '（' + priorPhase + '）' : '') + 'の状態に戻りますがよろしいですか？')) return;

  const { error: delError } = await sb.from('pipeline_phase_history').delete().eq('pipeline_id', pipelineId).eq('phase', '内定承諾');
  if (delError) { alert('決定履歴の削除に失敗しました: ' + delError.message); return; }

  const pipelineResetPayload = { status: '進行中', phase: priorPhase };
  const { error: pipelineError } = await sb.from('pipeline').update(pipelineResetPayload).eq('id', pipelineId);
  if (pipelineError) { alert('パイプラインのフェーズ/ステータスの更新に失敗しました: ' + pipelineError.message); return; }
  Object.assign(p, pipelineResetPayload);

  if (p.candidate_id) {
    const resetPayload = {
      gross_profit: null, gross_profit_fee_rate: null, gross_profit_calculated_at: null,
      decision_yomi: null, revenue_yomi: null, theoretical_salary: null,
      phase: pipelinePhaseToCandidatePhase(priorPhase), status: '進行中',
    };
    const { error: resetError } = await sb.from('candidates').update(resetPayload).eq('id', p.candidate_id);
    if (resetError) { alert('候補者データのリセットに失敗しました: ' + resetError.message); return; }
    if (p.candidates) Object.assign(p.candidates, resetPayload);
  }
  const refreshedHistory = await fetchAllRange('pipeline_phase_history', '*');
  PHASE_HISTORY = refreshedHistory || PHASE_HISTORY.filter(h => !(h.pipeline_id === pipelineId && h.phase === '内定承諾'));
  alert('内定承諾を取り消しました');
  render();
}

async function saveAcceptDate(pipelineId, value) {
  if (!value) { alert('日付を入力してください'); return; }
  const newDate = new Date(value + 'T12:00:00').toISOString();
  const records = PHASE_HISTORY.filter(h => h.pipeline_id === pipelineId && h.phase === '内定承諾');
  if (!records.length) { alert('内定承諾の履歴が見つかりませんでした'); return; }
  const record = records.slice().sort((a,b) => a.changed_at.localeCompare(b.changed_at))[0];
  const { error } = await sb.from('pipeline_phase_history').update({ changed_at: newDate }).eq('pipeline_id', pipelineId).eq('phase', '内定承諾').eq('changed_at', record.changed_at);
  if (error) { alert('決定日の更新に失敗しました: ' + error.message); return; }
  record.changed_at = newDate;
  const p = PIPELINE_DATA.find(x => x.id === pipelineId);
  if (p && p.candidate_id && p.candidates) {
    const { error: candError } = await sb.from('candidates').update({ gross_profit_calculated_at: newDate }).eq('id', p.candidate_id);
    if (!candError) p.candidates.gross_profit_calculated_at = newDate;
  }
  renderKeepScroll();
}

async function saveHireDate(pipelineId, value) {
  const p = PIPELINE_DATA.find(x => x.id === pipelineId);
  const payload = { hire_date: value || null };
  // 入金日が未設定の場合のみ、入社日の翌月末を自動セット（既に入っていれば上書きしない）
  if (value && p && !p.payment_date) {
    payload.payment_date = lastDayOfNextMonth(value);
  }
  const { error } = await sb.from('pipeline').update(payload).eq('id', pipelineId);
  if (error) { alert('保存に失敗しました: ' + error.message); return; }
  if (p) {
    p.hire_date = value || null;
    if (payload.payment_date) p.payment_date = payload.payment_date;
  }
  renderKeepScroll();
}

async function toggleChecklistItem(pipelineId, key, checked) {
  const { error } = await sb.from('pipeline').update({ [key]: checked }).eq('id', pipelineId);
  if (error) { alert('保存に失敗しました: ' + error.message); return; }
  const p = PIPELINE_DATA.find(x => x.id === pipelineId);
  if (p) p[key] = checked;
  renderKeepScroll();
}
</script>
