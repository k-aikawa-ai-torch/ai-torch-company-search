<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI torch パイプライン</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Zen Kaku Gothic New',-apple-system,BlinkMacSystemFont,sans-serif;background:#FFFFFF;color:#14213D;min-height:100vh}
#lock-screen{position:fixed;inset:0;background:#14213D;display:flex;align-items:center;justify-content:center;z-index:9999}
#lock-box{background:#FFFFFF;border-radius:4px;padding:36px 40px;width:320px;text-align:center}
#lock-box h2{font-size:16px;font-weight:500;margin-bottom:6px}
#lock-box p{font-size:13px;color:#6B7A99;margin-bottom:20px}
#lock-box input{width:100%;height:40px;padding:0 14px;border:1px solid #DEE7F7;border-radius:4px;font-size:15px;margin-bottom:10px;background:#fff}
#lock-box input:focus{outline:none;border-color:#0D40D9}
#lock-box button{width:100%;height:40px;background:#14213D;color:#fff;border:none;border-radius:4px;font-size:14px;cursor:pointer}
#lock-error{color:#0D40D9;font-size:12px;margin-top:8px;min-height:18px}
#app{display:none}
.main{max-width:1100px;margin:0 auto;padding:16px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.filters input{height:36px;padding:0 12px;border:1px solid #DEE7F7;border-radius:8px;background:#fff;font-size:13px;min-width:200px}
.filters select{height:36px;padding:0 10px;border:1px solid #DEE7F7;border-radius:8px;background:#fff;font-size:13px}
.filter-btn{padding:0 14px;height:36px;border-radius:8px;font-size:13px;cursor:pointer;transition:all 0.15s}
.filter-btn.on{background:#14213D;color:#fff;border:1px solid #14213D}
.filter-btn.off{background:#fff;color:#14213D;border:1px solid #DEE7F7}
.tag-filters{display:flex;flex-wrap:wrap;gap:6px}
.tag{padding:5px 12px;border:1px solid #DEE7F7;border-radius:20px;font-size:12px;cursor:pointer;background:#fff;color:#555;white-space:nowrap;transition:all 0.15s;user-select:none;display:inline-block}
.tag.on{background:#14213D;color:#fff;border-color:#14213D}
#status-phase-filters.show{display:flex !important}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:20px}
.two-col-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
@media (max-width:900px){.two-col-row{grid-template-columns:1fr}}
.summary-card{background:#fff;border:1px solid #DEE7F7;border-radius:10px;padding:12px 16px}
.summary-label{font-size:11px;color:#6B7A99;margin-bottom:4px}
.summary-value{font-size:20px;font-weight:600;color:#14213D}
.section-title{font-size:13px;font-weight:500;color:#6B7A99;margin:20px 0 10px;text-transform:uppercase;letter-spacing:0.05em}
.action-day-group{margin-bottom:14px}
.action-day-header{font-size:13px;font-weight:600;padding:6px 0;color:#14213D;border-bottom:2px solid #DEE7F7;margin-bottom:6px;position:sticky;top:0;background:#fff}
.action-day-header.is-today{color:#0D40D9}
.action-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid #f5f5f5;font-size:12.5px;cursor:pointer}
.action-row:hover{background:#fafaf8}
.action-row .a-candidate{font-weight:500;min-width:90px;cursor:pointer}
.action-row .a-company{color:#6B7A99;min-width:120px}
.action-row .a-phase{min-width:80px}
.action-row .a-note{flex:1}
.action-row .a-note input{width:100%;height:28px;padding:0 8px;border:1px solid #DEE7F7;border-radius:6px;font-size:12px}
.action-list-wrap{max-height:220px;overflow-y:auto;border:1px solid #DEE7F7;border-radius:10px;padding:12px;background:#fafbfe}
.action-list-more{text-align:center;padding:8px;font-size:12px;color:#0D40D9;cursor:pointer}
td input, td select{width:100%;height:28px;padding:0 6px;border:1px solid transparent;border-radius:4px;font-size:12px;background:transparent}
td input:hover, td select:hover{border-color:#DEE7F7;background:#fff}
td input:focus, td select:focus{border-color:#0D40D9;background:#fff;outline:none}
.icon-btn{background:none;border:none;cursor:pointer;color:#6B7A99;font-size:14px;padding:4px}
#pipeline-table{table-layout:fixed;width:100%}
#pipeline-table thead th{position:sticky;top:0;z-index:5;background:#f9f9f7;white-space:nowrap}
.col-resizer{position:absolute;right:-4px;top:0;bottom:0;width:8px;cursor:col-resize;z-index:6;user-select:none}
.col-resizer:hover, .col-resizer.resizing{background:#0D40D9}
#pipeline-table td{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:0}
#pipeline-table td input, #pipeline-table td select{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pipeline-table.hide-member-col #col-0{visibility:collapse}
#pipeline-table.hide-member-col .col-member{padding:0;border:none;width:0;overflow:hidden}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.count{font-size:13px;color:#6B7A99}
.sort-wrap{display:flex;align-items:center;gap:6px;font-size:13px;color:#666}
.sort-wrap select{height:30px;font-size:12px;padding:0 8px;border:1px solid #DEE7F7;border-radius:6px;background:#fff}
.table-wrap{overflow:auto;max-height:calc(100vh - 200px);border:1px solid #DEE7F7;border-radius:8px}
table{width:100%;border-collapse:collapse;background:#fff;font-size:12px}
th{background:#f9f9f7;font-size:11px;font-weight:500;color:#6B7A99;padding:8px 12px;text-align:left;border-bottom:1px solid #DEE7F7;white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid #FFFFFF;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafaf8;cursor:pointer}
.phase-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500;white-space:nowrap}
.ph-return{background:#fef3cd;color:#7d5a00}
.ph-propose{background:#d4edda;color:#155724}
.ph-selection{background:#cce5ff;color:#004085}
.ph-offer{background:#e2d9f3;color:#3d2080}
.ph-joined{background:#d1ecf1;color:#0c5460}
.ph-other{background:#f1f1f1;color:#666}
.memo-cell{max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#666}
.today-badge{background:#ffebcc;color:#b35a00;padding:1px 6px;border-radius:8px;font-size:10px;margin-left:4px}
.overdue-badge{background:#feecec;color:#991a1a;padding:1px 6px;border-radius:8px;font-size:10px;margin-left:4px}
.soon-badge{background:#e8f4fd;color:#0066cc;padding:1px 6px;border-radius:8px;font-size:10px;margin-left:4px}
.funnel-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-bottom:16px}
.funnel-item{background:#fff;border:1px solid #DEE7F7;border-radius:10px;padding:10px 12px;text-align:center;cursor:pointer;transition:all 0.15s}
.funnel-item:hover{border-color:#0D40D9}
.funnel-item.active{border-color:#14213D;background:#14213D}
.funnel-item.active .funnel-num,.funnel-item.active .funnel-label{color:#fff}
.funnel-num{font-size:20px;font-weight:600;color:#14213D}
.funnel-label{font-size:10px;color:#6B7A99;margin-top:2px}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center}
#decision-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1100;align-items:center;justify-content:center}
#decision-modal.open{display:flex}
#modal.open{display:flex}
#modal-box{background:#fff;border-radius:12px;width:90%;max-width:600px;max-height:85vh;overflow-y:auto;padding:24px}
#modal-box h2{font-size:16px;font-weight:500;margin-bottom:4px}
.modal-subtitle{font-size:13px;color:#6B7A99;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #f0f0f0}
.modal-close{float:right;background:none;border:none;font-size:20px;cursor:pointer;color:#6B7A99}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
.detail-item{padding:6px 0;border-bottom:1px solid #FFFFFF}
.detail-label{font-size:10px;color:#aaa;margin-bottom:2px}
.detail-value{font-size:13px;color:#14213D}
.detail-full{grid-column:1/-1}
.memo-box{background:#f9f9f7;border:1px solid #DEE7F7;border-radius:8px;padding:12px;margin-top:4px;font-size:13px;color:#333;white-space:pre-wrap;line-height:1.6}
.loading{text-align:center;padding:40px;color:#6B7A99;font-size:14px}
.empty{text-align:center;padding:40px;color:#aaa;font-size:13px}
</style>

const PIPELINE_STATUS_LIST = ['進行中','終了_内定承諾','終了_入社済み','終了_辞退','終了_不合格','終了_その他'];
const ACCEPT_PHASES = ['内定承諾','入社待ち','入社済み'];
const FORECAST_ELIGIBLE_PHASES = ['カジュアル面談','一次面接','二次～面接','最終面接','内定'];

async function doLogin() {
  const email = document.getElementById('email-input').value;
  const password = document.getElementById('pw-input').value;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) {
    document.getElementById('lock-error').textContent = 'メールアドレスまたはパスワードが違います';
    return;
  }
  CURRENT_USER_EMAIL = email;
  showApp();
}

async function doLogout() {
  await sb.auth.signOut();
  location.reload();
}

function showApp() {
  document.getElementById('lock-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadData();
}

function renderLabInfo() {
  var el = document.getElementById('pf-lab-info');
  if (!el) return;
  var me = ALL_MEMBERS.find(function(m) { return m.email === CURRENT_USER_EMAIL; });
  if (!me || !me.lab_number) { el.textContent = ''; return; }
  var nicknames = me.nickname ? me.nickname.split(',') : [];
  var picked = nicknames.length ? nicknames[Math.floor(Math.random() * nicknames.length)] : '';
  el.textContent = 'Lab Member No.' + String(me.lab_number).padStart(3,'0') + (picked ? '「' + picked + '」' : '');
}

sb.auth.getSession().then(({ data: { session } }) => {
  if (session) { CURRENT_USER_EMAIL = session.user.email; showApp(); }
});

async function fetchAllRange(table, select) {
  let all = [], from = 0;
  const size = 1000;
  while (true) {
    const { data, error } = await sb.from(table).select(select).range(from, from + size - 1);
    if (error || !data || data.length === 0) break;
    all = all.concat(data);
    if (data.length < size) break;
    from += size;
  }
  return all;
}

async function loadData() {
  const [{ data, error }, membersRes, companiesRes, phaseHistory, viewsRes, feeRatesRes] = await Promise.all([
    sb.from('pipeline')
      .select('*, members(display_name,name), candidates(name,source,desired_salary,revenue_forecast,revenue_yomi,decision_yomi,gross_profit,gross_profit_calculated_at,status), companies(name)')
      .order('created_at', { ascending: false }),
    sb.from('members').select('*'),
    sb.from('companies').select('id,name'),
    fetchAllRange('pipeline_phase_history', '*'),
    sb.from('pipeline_views').select('*,members!created_by(display_name,name)').order('name'),
    sb.from('media_fee_rates').select('*'),
  ]);
  if (error) {
    document.getElementById('tbody').innerHTML = '<tr><td colspan="14" class="loading">読み込み失敗</td></tr>';
    return;
  }
  DATA = data;
  ALL_MEMBERS = membersRes.data || [];
  ALL_COMPANIES = companiesRes.data || [];
  PHASE_HISTORY = phaseHistory || [];
  PIPELINE_VIEWS = viewsRes.data || [];
  MEDIA_FEE_RATES = feeRatesRes.data || [];
  if (viewsRes.error) console.error('pipeline_views読み込みエラー:', viewsRes.error);
  document.getElementById('header-count').textContent = DATA.length + '件';
  ME = ALL_MEMBERS.find(function(m) { return m.email === CURRENT_USER_EMAIL; });
  if (ME) {
    const myLabel = Object.keys(MEMBER_MAP).find(function(k) { return MEMBER_MAP[k] === ME.name; });
    if (myLabel) {
      currentMember = myLabel;
      document.querySelectorAll('.member-tab').forEach(function(t) {
        t.classList.toggle('active', t.textContent === myLabel);
      });
    }
  }
  renderViewSelect();
  renderStatusPhaseFilters();
  renderCompanyDatalist();
  if (ME && ME.default_pipeline_view_id) {
    const v = PIPELINE_VIEWS.find(function(x) { return x.id === ME.default_pipeline_view_id; });
    if (v) { applyPipelineView(v.filters); }
  }
  renderFunnel();
  renderLabInfo();
  renderMonthSummary();
  renderActionList();
  render();
}

function setMember(m, el) {

function getFiltered() {
  const q = (document.getElementById('q').value || '').toLowerCase();
  return DATA.filter(p => {
    if (currentMember !== '全員' && p.members?.name !== MEMBER_MAP[currentMember]) return false;
    if (activeStatusTags.size && !activeStatusTags.has(p.status)) return false;
    if (activePhaseTags.size && !activePhaseTags.has(p.phase)) return false;
    if (q && !(p.job_name||'').toLowerCase().includes(q) && !(p.memo||'').toLowerCase().includes(q) && !(p.candidates?.name||'').toLowerCase().includes(q) && !(p.companies?.name||'').toLowerCase().includes(q) && !(p.next_action_note||'').toLowerCase().includes(q)) return false;
    return true;
  });
}

function renderStatusPhaseFilters() {

function togglePhaseTag(el) {

// 確定売上・粗利・パイプ数などの集計は、画面上のステータス絞り込みの影響を受けてはいけない
// （内定承諾になると自動でステータスが変わるため、絞り込みで確定実績が消えてしまう）
function getMemberScopedData() {
  return DATA.filter(p => {
    if (currentMember !== '全員' && p.members?.name !== MEMBER_MAP[currentMember]) return false;
    return true;
  });
}

function renderFunnel() {
  const base = getFilteredBase();
  const counts = {};
  base.forEach(p => { const ph = p.phase||'未設定'; counts[ph] = (counts[ph]||0)+1; });
  document.getElementById('funnel').innerHTML = PHASE_ORDER.filter(ph => counts[ph]).map(ph =>
    `<div class="funnel-item ${activePhaseTags.has(ph)?'active':''}" onclick="togglePhaseFromFunnel('${ph}')">
      <div class="funnel-num">${counts[ph]}</div>
      <div class="funnel-label">${ph}</div>
    </div>`
  ).join('');
}

function togglePhaseFromFunnel(ph) {
  activePhaseTags.has(ph) ? activePhaseTags.delete(ph) : activePhaseTags.add(ph);
  renderStatusPhaseFilters();
  renderFunnel();
  render();
}

function getPhaseClass(p) {
  if (!p) return 'ph-other';
  if (['返信来た！','初回面談DONE'].includes(p)) return 'ph-return';
  if (['求人提案なう','推薦するやでぃ','応募承諾'].includes(p)) return 'ph-propose';
  if (['書類選考','カジュアル面談','一次面接','二次～面接','最終面接'].includes(p)) return 'ph-selection';
  if (['内定'].includes(p)) return 'ph-offer';
  if (['内定承諾','入社待ち','入社済み'].includes(p)) return 'ph-joined';
  return 'ph-other';
}

function fmtDate(v) { return v ? v.substring(0,10) : '-'; }
function fmtSalary(v) { return v ? '¥'+(v/10000).toFixed(0)+'万' : '-'; }
function cleanSource(s) { return (s || '').trim().replace(/^[（(]+/, '').trim(); }

function getCurrentFeeRate(source) {
  const cleaned = cleanSource(source);
  const todayStr = today();
  const candidates = MEDIA_FEE_RATES.filter(r => r.source === cleaned && r.effective_from <= todayStr);
  if (!candidates.length) return 0;
  candidates.sort((a,b) => b.effective_from.localeCompare(a.effective_from));
  return candidates[0].fee_rate;
}

function calcGrossProfit(revenueYomi, source) {
  if (revenueYomi === null || revenueYomi === undefined) return null;
  const rate = getCurrentFeeRate(source);
  return { amount: Math.round(revenueYomi * (1 - rate)), rate: rate };
}
function toLocalDateStr(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function today() { return toLocalDateStr(new Date()); }
function dayDiff(d) {
  if (!d) return null;
  return Math.floor((new Date(d) - new Date(today())) / 86400000);
}

function dateLabel(d) {
  if (!d) return '-';
  const diff = dayDiff(d);
  let label = fmtDate(d);
  if (diff === 0) label += '<span class="today-badge">今日</span>';
  else if (diff < 0) label += '<span class="overdue-badge">期限切れ</span>';
  else if (diff <= 3) label += `<span class="soon-badge">あと${diff}日</span>`;
  return label;
}

function firstOccurrenceMap(pipelineItems, phases) {
  const ids = new Set(pipelineItems.map(p => p.id));
  const map = {};
  PHASE_HISTORY.filter(h => ids.has(h.pipeline_id) && phases.includes(h.phase)).forEach(h => {
    if (!map[h.pipeline_id] || h.changed_at < map[h.pipeline_id]) map[h.pipeline_id] = h.changed_at;
  });
  return map;
}

function currentMonthKey() { return new Date().toISOString().substring(0,7); }

function renderMonthSummary() {
  const el = document.getElementById('month-summary');
  if (!el) return;
  const scoped = getMemberScopedData();
  const month = currentMonthKey();

  // 確定売上・粗利：当月中に内定承諾へ初到達したもの（ダッシュボードと同じ定義）
  const acceptMap = firstOccurrenceMap(scoped, ACCEPT_PHASES);
  const countedCandidates = new Set();
  let confirmedRevenue = 0, confirmedProfit = 0;
  Object.keys(acceptMap).forEach(pid => {
    if (acceptMap[pid].substring(0,7) !== month) return;
    const p = scoped.find(x => x.id === pid);
    if (!p || !p.candidate_id || countedCandidates.has(p.candidate_id)) return;
    countedCandidates.add(p.candidate_id);
    if (p.candidates?.revenue_forecast) confirmedRevenue += p.candidates.revenue_forecast;
    if (p.candidates?.gross_profit != null && p.candidates?.gross_profit_calculated_at?.substring(0,7) === month) confirmedProfit += p.candidates.gross_profit;
  });

  // 売上見込み：カジュアル面談以降のフェーズがある候補者のrevenue_yomi合計（決定ヨミ反映済み）
  const qualifyingCandidateIds = new Set(
    scoped.filter(p => p.status === '進行中' && FORECAST_ELIGIBLE_PHASES.includes(p.phase)).map(p => p.candidate_id).filter(Boolean)
  );
  let forecastRevenue = 0;
  qualifyingCandidateIds.forEach(cid => {
    const p = scoped.find(x => x.candidate_id === cid);
    if (p && p.candidates?.revenue_yomi) forecastRevenue += p.candidates.revenue_yomi;
  });

  // パイプ数・パイプ人数：現在進行中×カジュアル面談〜内定のフェーズのパイプライン
  const PIPE_COUNT_PHASE_RANGE = ['カジュアル面談','一次面接','二次～面接','最終面接','内定'];
  const activePipes = scoped.filter(p => p.status === '進行中' && PIPE_COUNT_PHASE_RANGE.includes(p.phase));
  const activeUniqueCandidates = new Set(activePipes.map(p => p.candidate_id).filter(Boolean));

  el.innerHTML = [
    ['当月確定売上', fmtSalary(confirmedRevenue)],
    ['当月確定粗利', fmtSalary(confirmedProfit)],
    ['当月売上見込み', fmtSalary(forecastRevenue)],
    ['パイプ数', activePipes.length + '件'],
    ['パイプ人数', activeUniqueCandidates.size + '名'],
  ].map(([label,value]) => '<div class="summary-card"><div class="summary-label">' + label + '</div><div class="summary-value">' + value + '</div></div>').join('');
}

// ============ 日別アクションリスト ============
function renderActionList(skipAutoScroll) {
  const el = document.getElementById('action-list');
  if (!el) return;
  const scoped = getFilteredBase().filter(p => p.next_action_day);
  const byDate = {};
  scoped.forEach(p => {
    const d = p.next_action_day;
    if (!byDate[d]) byDate[d] = [];
    byDate[d].push(p);
  });

  const todayStr = today();
  const [ty, tm, td] = todayStr.split('-').map(Number);
  const dates = [];
  for (let i = actionListRange.from; i <= actionListRange.to; i++) {
    const d = new Date(ty, tm - 1, td + i);
    dates.push(toLocalDateStr(d));
  }

  let html = '';
  dates.forEach(d => {
    const items = byDate[d] || [];
    const isToday = d === todayStr;
    const label = d + (isToday ? '（今日）' : '') + '　' + items.length + '件';
    html += '<div class="action-day-group" id="ad-' + d + '">';
    html += '<div class="action-day-header' + (isToday?' is-today':'') + '">' + label + '</div>';
    if (!items.length) {
      html += '<div style="font-size:12px;color:#ccc;padding:6px 0">予定なし</div>';
    } else {
      items.forEach(p => {
        html += '<div class="action-row" onclick="openModalUnlessInput(event,\'' + p.id + '\')">' +
          '<span class="a-candidate">' + (p.candidates?.name||'-') + '</span>' +
          '<span class="a-company">' + (p.companies?.name||'-') + '</span>' +
          '<span class="a-phase"><span class="phase-badge ' + getPhaseClass(p.phase) + '">' + (p.phase||'-') + '</span></span>' +
          '<span class="a-note"><input type="text" value="' + (p.next_action_note||'').replace(/"/g,'&quot;') + '" placeholder="やること" onchange="inlineSave(\'' + p.id + '\',\'next_action_note\',this.value)"></span>' +
          '</div>';
      });
    }
    html += '</div>';
  });
  el.innerHTML = html;
  initActionListScroll();

  if (!skipAutoScroll) {
    requestAnimationFrame(() => {
      const anchor = document.getElementById('ad-' + todayStr);
      if (anchor) anchor.scrollIntoView({ block: 'start' });
    });
  }
}

function openModalUnlessInput(evt, id) {
  if (['INPUT','SELECT','BUTTON','OPTION'].includes(evt.target.tagName)) return;
  openModal(id);
}

function initActionListScroll() {
  const wrap = document.getElementById('action-list');
  if (!wrap || wrap._scrollBound) return;
  wrap._scrollBound = true;
  wrap.addEventListener('scroll', function() {
    if (wrap._expanding) return;
    if (wrap.scrollTop < 60) {
      wrap._expanding = true;
      const prevHeight = wrap.scrollHeight;
      const prevScrollTop = wrap.scrollTop;
      actionListRange.from -= 7;
      renderActionList(true);
      requestAnimationFrame(() => {
        wrap.scrollTop = prevScrollTop + (wrap.scrollHeight - prevHeight);
        wrap._expanding = false;
      });
    } else if (wrap.scrollTop + wrap.clientHeight > wrap.scrollHeight - 60) {
      wrap._expanding = true;
      actionListRange.to += 7;
      renderActionList(true);
      wrap._expanding = false;
    }
  });
}

function getCurrentPipelineFilterState() {
  return {
    q: document.getElementById('q').value,
    activeStatusTags: Array.from(activeStatusTags),
    activePhaseTags: Array.from(activePhaseTags),
    sort1: document.getElementById('sort1').value,
    sort2: document.getElementById('sort2').value,
    sort1Dir: sort1Dir,
    sort2Dir: sort2Dir,
  };
}

function applyPipelineView(filters) {
  document.getElementById('q').value = filters.q || '';
  activeStatusTags = new Set(filters.activeStatusTags || []);
  activePhaseTags = new Set(filters.activePhaseTags || []);
  document.getElementById('sort1').value = filters.sort1 || 'candidate';

function applySelectedView() {
  const id = document.getElementById('view-select').value;
  if (!id) return;
  const v = PIPELINE_VIEWS.find(x => x.id === id);

}

async function saveCurrentView() {
  const name = prompt('ビューの名前を入力してください（既存と同じ名前を入力すると上書きされます）:');
  if (!name) return;
  const filters = getCurrentPipelineFilterState();
  const existing = PIPELINE_VIEWS.find(v => v.name === name);
  if (existing) {
    if (!confirm('「' + name + '」は既に存在します。上書きしますか？')) return;
    const { error } = await sb.from('pipeline_views').update({ filters }).eq('id', existing.id);
    if (error) { alert('上書きに失敗しました: ' + error.message); return; }
  } else {
    const { error } = await sb.from('pipeline_views').insert({ name, filters, created_by: ME ? ME.id : null });
    if (error) { alert('保存に失敗しました: ' + error.message); return; }
  }
  const { data, error: refetchError } = await sb.from('pipeline_views').select('*,members!created_by(display_name,name)').order('name');
  if (refetchError) { alert('一覧の再取得に失敗しました: ' + refetchError.message); return; }
  PIPELINE_VIEWS = data || [];
  renderViewSelect();
  alert('保存しました（' + PIPELINE_VIEWS.length + '件のビューがあります）');
}

async function setAsDefaultView() {
  const id = document.getElementById('view-select').value;
  if (!id) { alert('デフォルトに設定するビューを選択してください'); return; }
  if (!ME) { alert('ログイン情報が取得できませんでした'); return; }
  const { error } = await sb.from('members').update({ default_pipeline_view_id: id }).eq('id', ME.id);
  if (error) { alert('設定に失敗しました: ' + error.message); return; }
  ME.default_pipeline_view_id = id;
  renderViewSelect();
  alert('このビューをデフォルトに設定しました');
}

async function deleteSelectedView() {
  const id = document.getElementById('view-select').value;
  if (!id) { alert('削除するビューを選択してください'); return; }
  const v = PIPELINE_VIEWS.find(x => x.id === id);
  if (!v) return;
  if (!confirm('「' + v.name + '」を削除してよいですか？')) return;
  const { error } = await sb.from('pipeline_views').delete().eq('id', id);
  if (error) { alert('削除に失敗しました: ' + error.message); return; }
  PIPELINE_VIEWS = PIPELINE_VIEWS.filter(x => x.id !== id);
  if (ME && ME.default_pipeline_view_id === id) {
    await sb.from('members').update({ default_pipeline_view_id: null }).eq('id', ME.id);
    ME.default_pipeline_view_id = null;
  }
  renderViewSelect();
}

async function deletePipelineRow(id) {
  const p = DATA.find(x => x.id === id);
  if (!p) return;
  if (!confirm((p.candidates?.name||'候補者') + ' の「' + (p.job_name||'求人') + '」を削除してよいですか？この操作は取り消せません。')) return;

  renderActionList();

function initColumnResize() {
  let dragging = null, startX = 0, startWidth = 0;
  document.querySelectorAll('.col-resizer').forEach(function(handle) {
    handle.addEventListener('mousedown', function(e) {
      const col = document.getElementById('col-' + handle.dataset.col);
      if (!col) return;
      dragging = col;
      startX = e.clientX;
      startWidth = col.getBoundingClientRect().width;
      handle.classList.add('resizing');
      e.preventDefault();
    });
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    const newWidth = Math.max(50, startWidth + (e.clientX - startX));
    dragging.style.width = newWidth + 'px';
  });
  document.addEventListener('mouseup', function() {
    if (dragging) {
      document.querySelectorAll('.col-resizer.resizing').forEach(h => h.classList.remove('resizing'));
      dragging = null;
    }
  });
}
initColumnResize();

function toggleSortDir(which) {
  if (which === 1) {
    sort1Dir *= -1;
    document.getElementById('sort1-dir-btn').textContent = sort1Dir === 1 ? '▲' : '▼';
  } else {
    sort2Dir *= -1;
    document.getElementById('sort2-dir-btn').textContent = sort2Dir === 1 ? '▲' : '▼';
  }
  render();
}

function render() {
  let res = getFiltered();
  const sort1 = document.getElementById('sort1').value;
  const sort2 = document.getElementById('sort2').value;

  function compareBy(key, a, b) {
    if (key === 'next_action') {
      if (a.next_action_day && b.next_action_day) return a.next_action_day.localeCompare(b.next_action_day);
      if (a.next_action_day) return -1;
      if (b.next_action_day) return 1;
      return 0;
    }
    if (key === 'phase') return PHASE_ORDER.indexOf(a.phase) - PHASE_ORDER.indexOf(b.phase);
    if (key === 'created') return (a.created_at||'').localeCompare(b.created_at||'');
    if (key === 'job') return (a.job_name||'').localeCompare(b.job_name||'','ja');
    if (key === 'candidate') return (a.candidates?.name||'').localeCompare(b.candidates?.name||'','ja');
    if (key === 'company') return (a.companies?.name||'').localeCompare(b.companies?.name||'','ja');
    if (key === 'next_action_note') return (a.next_action_note||'').localeCompare(b.next_action_note||'','ja');
    if (key === 'memo') return (a.memo||'').localeCompare(b.memo||'','ja');
    if (key === 'decision_yomi') {
      const pa = a.candidates?.decision_yomi ? parseInt(a.candidates.decision_yomi) : 0;
      const pb = b.candidates?.decision_yomi ? parseInt(b.candidates.decision_yomi) : 0;
      return pa - pb;
    }
    if (key === 'revenue_forecast') return (a.candidates?.revenue_forecast||0) - (b.candidates?.revenue_forecast||0);
    if (key === 'source') return cleanSource(a.candidates?.source).localeCompare(cleanSource(b.candidates?.source),'ja');
    if (key === 'status') return PIPELINE_STATUS_LIST.indexOf(a.status) - PIPELINE_STATUS_LIST.indexOf(b.status);
    return 0;
  }

  res.sort((a,b) => {
    const r1 = sort1Dir * compareBy(sort1, a, b);
    if (r1 !== 0) return r1;
    return sort2Dir * compareBy(sort2, a, b);
  });
  document.getElementById('count').textContent = res.length + '件';
  if (!res.length) {
    document.getElementById('tbody').innerHTML = '<tr><td colspan="14" class="empty">該当する案件がありません</td></tr>';
    return;
  }
  document.getElementById('tbody').innerHTML = res.map(p => {
    const memo = (p.memo||'').replace(/\n/g,' ');
    const phaseOpts = '<option value="">未設定</option>' + PIPELINE_PHASE_LIST.map(ph =>
      '<option' + (ph === p.phase ? ' selected' : '') + '>' + ph + '</option>'
    ).join('');
    const statusOpts = '<option value="">未設定</option>' + PIPELINE_STATUS_LIST.map(s =>
      '<option' + (s === p.status ? ' selected' : '') + '>' + s + '</option>'
    ).join('');
    return `<tr data-id="${p.id}" onclick="openModalUnlessInput(event,'${p.id}')" style="cursor:pointer">
      <td><button class="icon-btn" onclick="event.stopPropagation();openModal('${p.id}')" title="詳細">🔍</button><button class="icon-btn" onclick="event.stopPropagation();deletePipelineRow('${p.id}')" title="削除" style="color:#b3261e">🗑️</button></td>
      <td class="col-member" style="color:#6B7A99;font-size:11px">${p.members?.display_name||'-'}</td>
      <td><select onchange="inlineSave('${p.id}','status',this.value||null)">${statusOpts}</select></td>
      <td><strong>${p.candidates?.name||'-'}</strong></td>
      <td><input type="text" list="company-options" value="${(p.companies?.name||'').replace(/"/g,'&quot;')}" onchange="inlineSaveCompany('${p.id}',this.value)" placeholder="企業名で検索/新規入力"></td>
      <td><input type="text" value="${(p.job_name||'').replace(/"/g,'&quot;').replace(/\n/g,' ')}" onchange="inlineSave('${p.id}','job_name',this.value)"></td>
      <td><select onchange="inlinePhaseSave('${p.id}',this.value,this)">${phaseOpts}</select></td>
      <td><input type="date" value="${p.next_action_day||''}" onchange="inlineSave('${p.id}','next_action_day',this.value||null)"></td>
      <td><input type="text" value="${(p.next_action_note||'').replace(/"/g,'&quot;')}" onchange="inlineSave('${p.id}','next_action_note',this.value)" placeholder="やること"></td>
      <td><input type="text" value="${memo.replace(/"/g,'&quot;')}" onchange="inlineSave('${p.id}','memo',this.value)" title="${memo}"></td>
      <td style="color:#6B7A99;font-size:12px;white-space:nowrap">${p.candidates?.decision_yomi||'-'}</td>
      <td style="color:#6B7A99;font-size:12px;white-space:nowrap">${fmtSalary(p.candidates?.revenue_forecast)}</td>
      <td style="color:#6B7A99;font-size:12px;white-space:nowrap">${cleanSource(p.candidates?.source)||'-'}</td>
    </tr>`;
  }).join('');
  updateMemberColumnVisibility();
}

function updateMemberColumnVisibility() {
  const table = document.getElementById('pipeline-table');
  if (table) table.classList.toggle('hide-member-col', currentMember !== '全員');
}

function renderCompanyDatalist() {
  const dl = document.getElementById('company-options');
  if (!dl) return;
  dl.innerHTML = ALL_COMPANIES.map(c => '<option value="' + c.name.replace(/"/g,'&quot;') + '">').join('');
}

async function inlineSaveCompany(id, name) {
  name = (name || '').trim();
  const p = DATA.find(x => x.id === id);
  if (!p) return;
  if (!name) {
    await inlineSave(id, 'company_id', null);
    return;
  }
  let match = ALL_COMPANIES.find(c => c.name === name);
  if (!match) {
    if (!confirm('「' + name + '」は企業リストに存在しません。新規企業として登録しますか？')) {
      render();
      return;
    }
    const { data, error } = await sb.from('companies').insert({ name }).select().single();
    if (error) { alert('企業の新規登録に失敗しました: ' + error.message); render(); return; }
    match = data;
    ALL_COMPANIES.push(match);
    renderCompanyDatalist();
  }
  await inlineSave(id, 'company_id', match.id);
}

async function inlineSave(id, field, value) {
  const payload = { [field]: value, updated_at: new Date().toISOString() };
  const { error } = await sb.from('pipeline').update(payload).eq('id', id);
  if (error) { alert('保存に失敗しました: ' + error.message); return; }
  const p = DATA.find(x => x.id === id);
  if (p) {
    p[field] = value;
    if (field === 'company_id') { p.companies = ALL_COMPANIES.find(c => c.id === value) || null; }
  }
  renderMonthSummary();
  renderActionList();
}

function pipelinePhaseToCandidatePhase(pipelinePhase) {
  const map = {
    '内定': '内定KITAAA',
    '最終面接': '選考なう', '二次～面接': '選考なう', '一次面接': '選考なう', 'カジュアル面談': '選考なう', '書類選考': '選考なう',
    '応募承諾': '求人提案なう', '提案中': '求人提案なう', '未提案': '求人提案なう',
  };
  return map[pipelinePhase] || '選考なう';
}

function lastDayOfNextMonth(hireDate) {
  const d = new Date(hireDate);
  const nextMonthLastDay = new Date(d.getFullYear(), d.getMonth() + 2, 0);
  return toLocalDateStr(nextMonthLastDay);
}

let pendingDecisionPipelineId = null;
let pendingDecisionSelectEl = null;
let pendingDecisionOldPhase = null;

function inlinePhaseSave(id, newPhase, selectEl) {
  const p = DATA.find(x => x.id === id);
  if (!p) return;
  const oldPhase = p.phase;
  if (newPhase && newPhase !== oldPhase && newPhase === '内定承諾') {
    pendingDecisionPipelineId = id;
    pendingDecisionSelectEl = selectEl || null;
    pendingDecisionOldPhase = oldPhase;
    document.getElementById('dm-decision-date').value = today();
    document.getElementById('dm-theoretical-salary').value = '';
    document.getElementById('dm-hire-date').value = '';
    document.getElementById('decision-modal').classList.add('open');
    return;
  }
  proceedPhaseSave(id, newPhase, oldPhase, new Date().toISOString(), null, null);
}

function cancelDecisionModal() {
  if (pendingDecisionSelectEl) pendingDecisionSelectEl.value = pendingDecisionOldPhase || '';
  document.getElementById('decision-modal').classList.remove('open');
  pendingDecisionPipelineId = null;
  pendingDecisionSelectEl = null;
}

async function confirmDecisionModal() {
  const id = pendingDecisionPipelineId;
  const oldPhase = pendingDecisionOldPhase;
  if (!id) return;
  const dateVal = document.getElementById('dm-decision-date').value;
  const decisionDate = dateVal ? new Date(dateVal + 'T12:00:00').toISOString() : new Date().toISOString();
  const salaryVal = document.getElementById('dm-theoretical-salary').value;
  const theoreticalSalaryInput = salaryVal ? parseFloat(salaryVal) : null;
  const hireDateInput = document.getElementById('dm-hire-date').value || null;
  document.getElementById('decision-modal').classList.remove('open');
  pendingDecisionPipelineId = null;
  pendingDecisionSelectEl = null;
  await proceedPhaseSave(id, '内定承諾', oldPhase, decisionDate, theoreticalSalaryInput, hireDateInput);
}

async function proceedPhaseSave(id, newPhase, oldPhase, decisionDate, theoreticalSalaryInput, hireDateInput) {
  const p = DATA.find(x => x.id === id);
  if (!p) return;
  // 内定承諾から他フェーズへ戻した場合、誤登録の取り消しとして決定履歴・粗利等をリセットする
  if (oldPhase === '内定承諾' && newPhase !== '内定承諾' && p.candidate_id) {
    if (!confirm('内定承諾を取り消します。この決定に紐づく決定日・粗利・フェーズ/ステータスの記録も登録前の状態に戻りますがよろしいですか？')) return;
    const { error: delError } = await sb.from('pipeline_phase_history').delete().eq('pipeline_id', id).eq('phase', '内定承諾');
    if (delError) { alert('決定履歴の削除に失敗しました: ' + delError.message); return; }
    PHASE_HISTORY = PHASE_HISTORY.filter(h => !(h.pipeline_id === id && h.phase === '内定承諾'));
    const resetPayload = {
      gross_profit: null, gross_profit_fee_rate: null, gross_profit_calculated_at: null,
      decision_yomi: null, revenue_yomi: null, theoretical_salary: null,
      phase: pipelinePhaseToCandidatePhase(newPhase), status: '進行中',
    };
    const { error: resetError } = await sb.from('candidates').update(resetPayload).eq('id', p.candidate_id);
    if (resetError) { alert('候補者データのリセットに失敗しました: ' + resetError.message); return; }
    if (p.candidates) Object.assign(p.candidates, resetPayload);
  }
  const payload = { phase: newPhase || null, updated_at: new Date().toISOString() };
  if (hireDateInput) payload.hire_date = hireDateInput;
  if (hireDateInput && !p.payment_date) payload.payment_date = lastDayOfNextMonth(hireDateInput);
  if (oldPhase === '内定承諾' && newPhase !== '内定承諾' && newPhase !== '入社済み') payload.status = '進行中';
  // 入社済みになったら自動的にステータスも終了_入社済みにする
  if (newPhase === '入社済み') payload.status = '終了_入社済み';
  else if (newPhase === '内定承諾') payload.status = '終了_内定承諾';
  const { error } = await sb.from('pipeline').update(payload).eq('id', id);
  if (error) { alert('保存に失敗しました: ' + error.message); return; }
  p.phase = newPhase || null;
  if (hireDateInput) p.hire_date = hireDateInput;
  if (payload.payment_date) p.payment_date = payload.payment_date;
  if (payload.status) p.status = payload.status;
  if (newPhase && newPhase !== oldPhase) {
    const { error: histError } = await sb.from('pipeline_phase_history').insert({ pipeline_id: id, phase: newPhase, changed_at: decisionDate });
    if (histError) { alert('フェーズ履歴の記録に失敗しました（ダッシュボードの集計に影響します）: ' + histError.message); }
    else { PHASE_HISTORY.push({ pipeline_id: id, phase: newPhase, changed_at: decisionDate }); }
  }
  if (newPhase && newPhase !== oldPhase && newPhase === '内定承諾' && p.candidate_id) {
    const candUpdate = {
      phase: '内定承諾歓喜',
      status: '終了_承諾済み（フォローしようね）',
      decision_yomi: '100%',
      revenue_yomi: p.candidates?.revenue_forecast || null,
      theoretical_salary: theoreticalSalaryInput != null ? theoreticalSalaryInput : (p.candidates?.revenue_forecast || null),
    };
    const gp = calcGrossProfit(p.candidates?.revenue_forecast, p.candidates?.source);
    if (gp) {
      candUpdate.gross_profit = gp.amount;
      candUpdate.gross_profit_fee_rate = gp.rate;
      candUpdate.gross_profit_calculated_at = decisionDate;
    }
    const { error: gpError } = await sb.from('candidates').update(candUpdate).eq('id', p.candidate_id);
    if (gpError) { alert('候補者データの自動更新に失敗しました: ' + gpError.message); }
    else if (p.candidates) { Object.assign(p.candidates, candUpdate); }
  }
  renderFunnel();
  renderMonthSummary();
  renderActionList();
  render();
}

function openModal(id) {
  const p = DATA.find(d => d.id === id);
  if (!p) return;
  document.getElementById('modal-title').textContent = (p.job_name||'').replace(/\n/g,' ');
  document.getElementById('modal-sub').textContent = (p.candidates?.name||'-') + ' ／ ' + (p.companies?.name||'-') + ' ／ ' + (p.members?.display_name||'-');
  const acceptRecord = getAcceptHistoryRecord(id);
  const acceptHistoryHtml = acceptRecord
    ? '<div class="detail-item detail-full"><div class="detail-label">内定承諾の決定日（修正可）</div><div style="display:flex;gap:8px;align-items:center">' +
      '<input type="date" id="modal-decision-date" value="' + acceptRecord.changed_at.substring(0,10) + '" class="hire-date-input">' +
      '<button class="icon-btn" style="border:1px solid #DEE7F7;border-radius:6px;padding:4px 10px" onclick="saveDecisionDate(\'' + id + '\')">更新</button>' +
      '</div></div>'
    : '';
  document.getElementById('modal-content').innerHTML = `
    <div class="detail-item"><div class="detail-label">フェーズ</div><div class="detail-value"><span class="phase-badge ${getPhaseClass(p.phase)}">${p.phase||'-'}</span></div></div>
    <div class="detail-item"><div class="detail-label">ステータス</div><div class="detail-value">${p.status||'-'}</div></div>
    <div class="detail-item"><div class="detail-label">NextAction日</div><div class="detail-value">${dateLabel(p.next_action_day)}</div></div>
    <div class="detail-item"><div class="detail-label">NextActionの内容</div><div class="detail-value">${p.next_action_note||'-'}</div></div>
    <div class="detail-item"><div class="detail-label">推薦日</div><div class="detail-value">${fmtDate(p.recommended_at)}</div></div>
    <div class="detail-item"><div class="detail-label">売上見込み</div><div class="detail-value">${fmtSalary(p.candidates?.revenue_forecast)}</div></div>
    <div class="detail-item"><div class="detail-label">希望年収</div><div class="detail-value">${fmtSalary(p.candidates?.desired_salary)}</div></div>
    <div class="detail-item"><div class="detail-label">流入経路</div><div class="detail-value">${p.candidates?.source||'-'}</div></div>
    <div class="detail-item"><div class="detail-label">登録日</div><div class="detail-value">${fmtDate(p.created_at)}</div></div>
    ${p.memo ? `<div class="detail-item detail-full"><div class="detail-label">メモ</div><div class="memo-box">${p.memo}</div></div>` : ''}
    ${acceptHistoryHtml}
  `;
  document.getElementById('modal-delete-btn').onclick = function() { closeModal(); deletePipelineRow(id); };
  document.getElementById('modal').classList.add('open');
}

function getAcceptHistoryRecord(pipelineId) {
  const records = PHASE_HISTORY.filter(h => h.pipeline_id === pipelineId && h.phase === '内定承諾');
  if (!records.length) return null;
  return records.slice().sort((a,b) => a.changed_at.localeCompare(b.changed_at))[0];
}

async function saveDecisionDate(pipelineId) {
  const dateVal = document.getElementById('modal-decision-date').value;
  if (!dateVal) { alert('日付を入力してください'); return; }
  const newDate = new Date(dateVal + 'T12:00:00').toISOString();
  const record = getAcceptHistoryRecord(pipelineId);
  if (!record) { alert('内定承諾の履歴が見つかりませんでした'); return; }
  const { error } = await sb.from('pipeline_phase_history').update({ changed_at: newDate }).eq('pipeline_id', pipelineId).eq('phase', '内定承諾').eq('changed_at', record.changed_at);
  if (error) { alert('決定日の更新に失敗しました: ' + error.message); return; }
  record.changed_at = newDate;
  const p = DATA.find(x => x.id === pipelineId);
  if (p && p.candidate_id && p.candidates) {
    const { error: candError } = await sb.from('candidates').update({ gross_profit_calculated_at: newDate }).eq('id', p.candidate_id);
    if (!candError) p.candidates.gross_profit_calculated_at = newDate;
  }
  alert('決定日を更新しました');
  renderMonthSummary();
  openModal(pipelineId);
}

function closeModal() { document.getElementById('modal').classList.remove('open'); }
document.getElementById('modal').addEventListener('click', e => { if (e.target === document.getElementById('modal')) closeModal(); });
</script>
