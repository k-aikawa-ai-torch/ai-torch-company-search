<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>パスワード再設定 | AI torch</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#1c2b24;
    --ink-soft:#4a5c52;
    --paper:#f6f4ee;
    --card:#ffffff;
    --line:#dde2dc;
    --forest:#2f5d4f;
    --forest-deep:#234438;
    --ember:#c15f3c;
    --error:#b4392f;
    --error-bg:#fbeceA;
    --ok-bg:#eaf3ec;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:"Hiragino Sans","Yu Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--paper);
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .wrap{
    width:100%;
    max-width:400px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:28px;
    color:var(--forest-deep);
  }
  .brand .mark{
    width:34px;height:34px;
    border-radius:8px;
    background:var(--forest);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:17px;
    flex-shrink:0;
  }
  .brand .name{
    font-size:15px;
    font-weight:600;
    letter-spacing:.02em;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:32px 28px;
  }
  h1{
    font-size:19px;
    margin:0 0 6px;
    font-weight:700;
    color:var(--ink);
  }
  .sub{
    font-size:13.5px;
    color:var(--ink-soft);
    margin:0 0 26px;
    line-height:1.6;
  }
  label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .field{margin-bottom:16px;}
  .pw-row{position:relative;}
  input[type="password"], input[type="text"]{
    width:100%;
    padding:10px 40px 10px 12px;
    border:1px solid var(--line);
    border-radius:7px;
    font-size:14.5px;
    background:#fcfcfa;
    color:var(--ink);
    outline:none;
    transition:border-color .15s;
  }
  input:focus{
    border-color:var(--forest);
    background:#fff;
  }
  .toggle-vis{
    position:absolute;
    right:10px; top:50%;
    transform:translateY(-50%);
    background:none;border:none;cursor:pointer;
    font-size:13px;color:var(--ink-soft);
    padding:4px;
  }
  .strength{
    height:3px;
    border-radius:2px;
    background:var(--line);
    margin-top:8px;
    overflow:hidden;
  }
  .strength-fill{
    height:100%;
    width:0%;
    background:var(--line);
    transition:width .2s, background .2s;
  }
  .strength-label{
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:5px;
    min-height:14px;
  }
  .hint{
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:6px;
    line-height:1.5;
  }
  button.submit{
    width:100%;
    padding:11px;
    border:none;
    border-radius:7px;
    background:var(--forest);
    color:#fff;
    font-size:14.5px;
    font-weight:600;
    cursor:pointer;
    margin-top:8px;
    transition:background .15s;
  }
  button.submit:hover:not(:disabled){background:var(--forest-deep);}
  button.submit:disabled{
    background:#a9b8b1;
    cursor:not-allowed;
  }
  .msg{
    display:none;
    font-size:13px;
    padding:10px 12px;
    border-radius:7px;
    margin-bottom:16px;
    line-height:1.6;
  }
  .msg.error{
    display:block;
    background:var(--error-bg);
    color:var(--error);
  }
  .msg.ok{
    display:block;
    background:var(--ok-bg);
    color:var(--forest-deep);
  }
  .state{display:none;}
  .state.active{display:block;}
  .center-icon{
    font-size:30px;
    margin-bottom:12px;
  }
  .spinner{
    width:22px;height:22px;
    border:2.5px solid var(--line);
    border-top-color:var(--forest);
    border-radius:50%;
    animation:spin .7s linear infinite;
    margin:0 auto 14px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .center-text{
    text-align:center;
    color:var(--ink-soft);
    font-size:13.5px;
    line-height:1.7;
  }
  a.back-link{
    display:inline-block;
    margin-top:18px;
    font-size:13px;
    color:var(--forest);
    text-decoration:none;
  }
  a.back-link:hover{text-decoration:underline;}
</style>
</head>
<body>

<div class="wrap">
  <div class="brand">
    <div class="mark">🔐</div>
    <div class="name">AI torch 社内システム</div>
  </div>

  <div class="card">

    <!-- 状態1: リンク確認中 -->
    <div class="state active" id="state-checking">
      <div class="spinner"></div>
      <p class="center-text">リンクを確認しています…</p>
    </div>

    <!-- 状態2: 新パスワード入力フォーム -->
    <div class="state" id="state-form">
      <h1>新しいパスワードを設定</h1>
      <p class="sub">アカウントの新しいパスワードを入力してください。</p>

      <div class="msg error" id="form-error"></div>

      <form id="pw-form">
        <div class="field">
          <label for="pw1">新しいパスワード</label>
          <div class="pw-row">
            <input type="password" id="pw1" autocomplete="new-password" minlength="8" required>
            <button type="button" class="toggle-vis" data-target="pw1">表示</button>
          </div>
          <div class="strength"><div class="strength-fill" id="strength-fill"></div></div>
          <div class="strength-label" id="strength-label"></div>
        </div>

        <div class="field">
          <label for="pw2">新しいパスワード（確認）</label>
          <div class="pw-row">
            <input type="password" id="pw2" autocomplete="new-password" minlength="8" required>
            <button type="button" class="toggle-vis" data-target="pw2">表示</button>
          </div>
          <div class="hint">8文字以上で設定してください。</div>
        </div>

        <button type="submit" class="submit" id="submit-btn">パスワードを更新</button>
      </form>
    </div>

    <!-- 状態3: 更新中 -->
    <div class="state" id="state-saving">
      <div class="spinner"></div>
      <p class="center-text">更新しています…</p>
    </div>

    <!-- 状態4: 完了 -->
    <div class="state" id="state-done">
      <div class="center-icon">✅</div>
      <h1>パスワードを更新しました</h1>
      <p class="sub" style="margin-bottom:4px;">新しいパスワードでログインできます。</p>
      <a href="./index.html" class="back-link">ログイン画面に戻る →</a>
    </div>

    <!-- 状態5: リンク無効・エラー -->
    <div class="state" id="state-invalid">
      <div class="center-icon">⚠️</div>
      <h1>リンクが無効です</h1>
      <p class="sub" id="invalid-reason">このリンクは有効期限が切れているか、既に使用されています。もう一度パスワード再設定をリクエストしてください。</p>
      <a href="./index.html" class="back-link">ログイン画面に戻る →</a>
    </div>

  </div>
</div>

<script>
  // ── Supabase 接続設定 ──────────────────────────────
  // Project Settings > API から取得した anon public key に差し替えてください。
  const SUPABASE_URL = "https://vqunibhzmvlckqbydgea.supabase.co";
  const SUPABASE_ANON_KEY = "YOUR_ANON_KEY"; // ← ここを実際のanon keyに置き換える

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const showState = (id) => {
    document.querySelectorAll(".state").forEach(el => el.classList.remove("active"));
    document.getElementById(id).classList.add("active");
  };

  // 表示/非表示トグル
  document.querySelectorAll(".toggle-vis").forEach(btn => {
    btn.addEventListener("click", () => {
      const target = document.getElementById(btn.dataset.target);
      const isPw = target.type === "password";
      target.type = isPw ? "text" : "password";
      btn.textContent = isPw ? "隠す" : "表示";
    });
  });

  // 簡易パスワード強度表示
  const pw1 = document.getElementById("pw1");
  const strengthFill = document.getElementById("strength-fill");
  const strengthLabel = document.getElementById("strength-label");
  pw1.addEventListener("input", () => {
    const v = pw1.value;
    let score = 0;
    if (v.length >= 8) score++;
    if (v.length >= 12) score++;
    if (/[A-Z]/.test(v) && /[a-z]/.test(v)) score++;
    if (/[0-9]/.test(v)) score++;
    if (/[^A-Za-z0-9]/.test(v)) score++;

    const levels = [
      { pct: 0,   color: "var(--line)",  label: "" },
      { pct: 20,  color: "var(--error)", label: "弱い" },
      { pct: 40,  color: "var(--error)", label: "弱い" },
      { pct: 60,  color: "var(--ember)", label: "普通" },
      { pct: 80,  color: "var(--forest)", label: "強い" },
      { pct: 100, color: "var(--forest)", label: "非常に強い" },
    ];
    const lvl = levels[Math.min(score, 5)];
    strengthFill.style.width = v.length ? lvl.pct + "%" : "0%";
    strengthFill.style.background = lvl.color;
    strengthLabel.textContent = v.length ? lvl.label : "";
  });

  // ── リカバリーセッションの検知 ──────────────────────
  // Supabase-jsはURL中のトークンを自動処理し、PASSWORD_RECOVERYイベントを発火する。
  // 万一イベントを取りこぼしても、既存セッションがあればフォームを出す。
  let handled = false;

  const proceedToForm = () => {
    if (handled) return;
    handled = true;
    showState("state-form");
  };

  const showInvalid = (reason) => {
    if (handled) return;
    handled = true;
    if (reason) document.getElementById("invalid-reason").textContent = reason;
    showState("state-invalid");
  };

  supabaseClient.auth.onAuthStateChange((event, session) => {
    if (event === "PASSWORD_RECOVERY") {
      proceedToForm();
    }
  });

  // フォールバック：数秒待ってもイベントが来ない場合はセッション有無で判定
  setTimeout(async () => {
    if (handled) return;
    const { data } = await supabaseClient.auth.getSession();
    if (data && data.session) {
      proceedToForm();
    } else {
      showInvalid();
    }
  }, 2500);

  // URLにSupabaseのエラーパラメータが含まれる場合（期限切れ等）を先に検知
  (function checkUrlError() {
    const hash = window.location.hash ? window.location.hash.substring(1) : "";
    const params = new URLSearchParams(hash || window.location.search);
    const errDesc = params.get("error_description") || params.get("error");
    if (errDesc) {
      showInvalid(decodeURIComponent(errDesc.replace(/\+/g, " ")));
    }
  })();

  // ── フォーム送信 ──────────────────────────────────
  document.getElementById("pw-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById("form-error");
    errorBox.style.display = "none";

    const v1 = pw1.value;
    const v2 = document.getElementById("pw2").value;

    if (v1.length < 8) {
      errorBox.textContent = "パスワードは8文字以上で入力してください。";
      errorBox.style.display = "block";
      return;
    }
    if (v1 !== v2) {
      errorBox.textContent = "パスワードが一致しません。";
      errorBox.style.display = "block";
      return;
    }

    showState("state-saving");

    const { error } = await supabaseClient.auth.updateUser({ password: v1 });

    if (error) {
      showState("state-form");
      errorBox.textContent = "更新に失敗しました：" + error.message;
      errorBox.style.display = "block";
      return;
    }

    showState("state-done");
  });
</script>

</body>
</html>
